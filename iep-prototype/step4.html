<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IEP 마법사 ④ 성취기준 선택 · 평가초점 개발 (프로토타입)</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1f2430; --sub:#6b7280; --line:#e3e6eb;
  --brand:#3b6ef5; --brand-weak:#eaf0ff; --ok:#15a36e; --ok-weak:#e6f6ef;
  --warn:#e0892b; --warn-weak:#fdf1e3; --target:#7c4dff; --target-weak:#f0eaff;
  --verb:#2f7de1; --intent:#e0892b; --desc:#15a36e;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
header{background:#1f2430;color:#fff;padding:14px 22px}
header h1{margin:0;font-size:16px;font-weight:700}
header .sub{font-size:12px;color:#aab1c0;margin-top:3px}
.wrap{display:flex;flex-direction:column;gap:16px;padding:16px;max-width:1180px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.card h2{font-size:13px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--sub);font-weight:700;letter-spacing:.2px;display:flex;justify-content:space-between;align-items:center}
.pad{padding:14px 16px}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr;gap:10px}
label.fld{display:block;font-size:12px;color:var(--sub);margin:0 0 4px}
select,input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink)}
.count{font-size:12px;color:var(--sub);margin:12px 0 8px;font-weight:600}
.cands{max-height:300px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;padding-right:4px}
.cand{border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer;transition:.12s}
.cand:hover{border-color:var(--brand);background:var(--brand-weak)}
.cand.sel{border-color:var(--brand);background:var(--brand-weak);box-shadow:inset 3px 0 0 var(--brand)}
.cand .code{font-size:11px;color:var(--brand);font-weight:700}
.cand .tx{font-size:13px;margin-top:2px}
.empty{color:var(--sub);text-align:center;padding:40px 10px;font-size:13px;grid-column:1/-1}
.banner{background:var(--brand-weak);border:1px solid #cfe0ff;border-radius:10px;padding:12px 14px;margin-bottom:14px}
.banner .code{color:var(--brand);font-weight:700;font-size:12px}
.banner .tx{font-size:16px;font-weight:650;margin-top:3px}
.step-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:700;font-size:13px}
.step-h .n{background:var(--brand);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.three{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dbox.desc{grid-column:1/-1}
.dbox textarea{width:100%;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;resize:vertical;line-height:1.55;color:var(--ink)}
.dbox{border:1px solid var(--line);border-radius:9px;padding:10px}
.dbox .lab{font-size:11px;font-weight:700;margin-bottom:6px}
.dbox.verb .lab{color:var(--verb)} .dbox.intent .lab{color:var(--intent)} .dbox.desc .lab{color:var(--desc)}
.dbox input{font-size:13px;padding:7px 8px}
.dbox .hint{font-size:10.5px;color:var(--sub);margin-top:5px}
.ladder{display:flex;flex-direction:column;gap:7px}
.lvl{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.lvl .ln{width:26px;height:26px;border-radius:50%;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--sub)}
.lvl .focus{font-size:13px}
.lvl .focus .role{font-size:11px;color:var(--sub)}
.lvl .toggle{display:flex;gap:4px}
.tg{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 8px;font-size:11.5px;cursor:pointer;color:var(--sub)}
.tg.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tg.no.on{background:var(--warn);border-color:var(--warn);color:#fff}
.lvl.s-ok{background:var(--ok-weak);border-color:#bfe6d4}
.lvl.s-no{background:var(--warn-weak);border-color:#f3dab4}
.lvl.target{background:var(--target-weak);border-color:#d8c9ff;box-shadow:0 0 0 1px var(--target) inset}
.lvl.target .ln{background:var(--target);color:#fff}
.tgt-tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--target);background:#fff;border:1px solid var(--target);border-radius:6px;padding:1px 6px;margin-left:6px}
.zpd-note{font-size:12px;color:var(--sub);margin:8px 0 0}
.adopt{margin-top:14px;border:1px dashed var(--line);border-radius:10px;padding:12px}
.adopt h3{margin:0 0 8px;font-size:12px;color:var(--sub)}
.goal{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:none}
.goal .badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--target-weak);color:var(--target);white-space:nowrap}
.aiNote{margin-top:16px;background:#fbfbfd;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--sub)}
.aiNote b{color:var(--ink)}
.pill{display:inline-block;background:#eef1f5;border-radius:20px;padding:2px 9px;font-size:11px;margin:2px 3px 0 0;color:#444}
.placeholder{color:var(--sub);text-align:center;padding:50px 20px}
.placeholder .big{font-size:15px;color:var(--ink);margin-bottom:6px;font-weight:600}
.eng-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}
@media(max-width:900px){.eng-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>IEP 마법사 · ④ 성취기준 선택 &amp; 평가초점 개발</h1>
  <div class="sub">2022 개정 특수교육 기본교육과정 성취기준 688개 · 프로토타입 (디자인·동작 확인용)</div>
</header>
<div class="wrap">

  <div class="card">
    <h2>① 성취기준 탐색 <span class="count" id="count" style="margin:0"></span></h2>
    <div class="pad">
      <div class="filters">
        <div><label class="fld">교과</label><select id="fSubject"></select></div>
        <div><label class="fld">학년군 (수준)</label><select id="fGrade"></select></div>
        <div><label class="fld">영역</label><select id="fArea"></select></div>
        <div><label class="fld">검색어</label><input type="text" id="fSearch" placeholder="내용 키워드 (예: 화폐, 덧셈, 높임말)"></div>
      </div>
      <div class="count" id="count2"></div>
      <div class="cands" id="cands"></div>
    </div>
  </div>

  <div class="card">
    <h2>② 평가초점 개발 (분해 → 확장 → 조립)</h2>
    <div class="pad" id="engine">
      <div class="placeholder">
        <div class="big">위에서 성취기준을 하나 선택하세요</div>
        교과·학년군·영역으로 좁힌 뒤 후보 카드를 고르면,<br>그 성취기준을 동사·지향·서술자로 분해하고 지원 수준별 평가초점·학습목표를 자동으로 펼쳐 드립니다.
      </div>
    </div>
  </div>

</div>

function initSubjects(){fSubject.appendChild(opt("","전체 교과"));uniq(rows.map(r=>r.subject)).forEach(s=>fSubject.appendChild(opt(s,s)));}
function refreshGrade(){fGrade.innerHTML="";fGrade.appendChild(opt("","전체 학년군"));let pool=rows.filter(r=>!fSubject.value||r.subject===fSubject.value);GORDER.filter(g=>pool.some(r=>r.gradeCode===g)).forEach(g=>fGrade.appendChild(opt(g,GRADE[g])));}
function refreshArea(){fArea.innerHTML="";fArea.appendChild(opt("","전체 영역"));let pool=rows.filter(r=>(!fSubject.value||r.subject===fSubject.value)&&(!fGrade.value||r.gradeCode==fGrade.value));uniq(pool.map(r=>r.area).filter(Boolean)).forEach(a=>fArea.appendChild(opt(a,a)));}
function filtered(){const q=fSearch.value.trim();return rows.filter(r=>(!fSubject.value||r.subject===fSubject.value)&&(!fGrade.value||r.gradeCode==fGrade.value)&&(!fArea.value||r.area===fArea.value)&&(!q||r.text.includes(q)||r.code.includes(q)));}

function recomputeTargets(){let lastOk=-1,anyNo=false;LEVELS.forEach((_,i)=>{if(states[i]==="ok")lastOk=i;if(states[i]==="no")anyNo=true;});let t=[];if(lastOk>=0&&lastOk<LEVELS.length-1)t=[lastOk+1,Math.min(lastOk+2,LEVELS.length-1)];else if(lastOk===LEVELS.length-1)t=[LEVELS.length-1];else if(anyNo)t=[1,2];return[...new Set(t)];}

  e.innerHTML=`
    <div class="banner"><div class="code">[${r.code}] · ${r.subject} · ${GRADE[r.gradeCode]}${r.area?" · "+r.area:""}</div><div class="tx">${r.text}</div></div>
    <div class="step-h"><span class="n">1</span> 성취기준 분해 (명시적 학습 요소)</div>
    <div class="three">
      <div class="dbox verb"><div class="lab">측정 가능한 동사<br><span style="font-weight:400;color:var(--sub)">과정·기능</span></div><input id="dVerb" value="${r.verb||''}"><div class="hint">무엇을 하는가</div></div>
      <div class="dbox intent"><div class="lab">행위의 지향<br><span style="font-weight:400;color:var(--sub)">가치·태도</span></div><input id="dIntent" value="${r.intent||''}" placeholder="(없으면 비움)"><div class="hint">어떤 방식·태도로</div></div>
      <div class="dbox desc"><div class="lab">서술자 <span style="font-weight:400;color:var(--sub)">· 지식·이해·대상 (무엇에 대해)</span></div><textarea id="dDesc" rows="2">${r.descriptor||''}</textarea></div>
    </div>
    <div class="eng-grid">
      <div>
        <div class="step-h"><span class="n">2</span>·<span class="n">3</span> 지원 수준별 평가초점 (기능분석 · ZPD)</div>
        <div class="ladder" id="ladder"></div>
        <div class="zpd-note">각 단계에서 학생이 <b style="color:var(--ok)">가능</b>/<b style="color:var(--warn)">어려움</b>을 체크하면, 경계 바로 위 단계를 <b style="color:var(--target)">학기목표 구간</b>으로 자동 추천(근접발달영역).</div>
      </div>
      <div>
        <div class="adopt" id="adopt"></div>
        <div class="aiNote"><b>실제 서비스에서는</b> 동사·지향·서술자 분해와 문장 다듬기를 AI가 자동 수행하고, 서술자도 스펙트럼으로 확장합니다(예: "나" → 나의 신상·몸·선호·흥미·감정·성장과정).</div>
      </div>
    </div>`;
  renderLadder();renderAdopt();
}
function renderLadder(){
  const L=$("#ladder");L.innerHTML="";
  LEVELS.forEach((lv,i)=>{const row=document.createElement("div");const st=states[i];
    row.className="lvl"+(st==="ok"?" s-ok":st==="no"?" s-no":"");
    row.innerHTML=`<div class="ln">${lv.n}</div><div class="focus"><span class="role">${lv.role}</span><br>${levelFocus(selected,i)}</div><div class="toggle"><span class="tg ok ${st==="ok"?"on":""}" data-i="${i}" data-v="ok">가능</span><span class="tg no ${st==="no"?"on":""}" data-i="${i}" data-v="no">어려움</span></div>`;
    L.appendChild(row);});
  L.querySelectorAll(".tg").forEach(t=>t.onclick=()=>{const i=+t.dataset.i,v=t.dataset.v;states[i]=states[i]===v?null:v;applyTargets();renderAdopt();});
  applyTargets();
}
function applyTargets(){const tgs=recomputeTargets();$("#ladder").querySelectorAll(".lvl").forEach((el,i)=>{const st=states[i];el.className="lvl"+(st==="ok"?" s-ok":st==="no"?" s-no":"");if(tgs.includes(i)){el.classList.add("target");const tag=document.createElement("span");tag.className="tgt-tag";tag.textContent="학기목표 후보";el.querySelector(".focus").appendChild(tag);}});}
function renderAdopt(){const tgs=recomputeTargets();const a=$("#adopt");a.innerHTML=`<h3>자동 추천 학기목표 (근접발달영역 기준)</h3>`+(tgs.length?tgs.map(i=>`<div class="goal"><span class="badge">${LEVELS[i].n} ${LEVELS[i].role}</span><div>${levelFocus(selected,i)}</div></div>`).join(""):`<div style="color:var(--sub);font-size:13px">왼쪽 단계에서 가능/어려움을 체크하면 목표가 추천됩니다.</div>`);}
initSubjects();
fSubject.onchange=()=>{refreshGrade();refreshArea();renderCands();};
fGrade.onchange=()=>{refreshArea();renderCands();};
fArea.onchange=renderCands;fSearch.oninput=renderCands;
refreshGrade();refreshArea();renderCands();
</script>
</body>
</html>
